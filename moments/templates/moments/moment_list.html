<!DOCTYPE html>
<html>
<body>

<h1>Your Moments</h1>

<p><a href="{% url 'logout' %}">Logout</a></p>

<ul>
{% for m in moments %}
    <li>
        <strong>{{ m.title }}</strong> — {{ m.created_at }}<br>
        {{ m.description }}<br>
        {% if m.media %}
            <a href="{{ m.media.url }}">{{ m.media.name }}</a>
        {% endif %}
    </li>
{% empty %}
    <li>No moments yet.</li>
{% endfor %}
</ul>

</body>
</html>
